<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAUF BAHERUNI - AI Bypass</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #1a1a1a; padding: 40px; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 450px; border: 1px solid #333; }
        .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #444; margin-bottom: 15px; }
        h1 { font-size: 24px; margin: 0; color: #fff; letter-spacing: 1px; }
        p.subtitle { color: #666; margin-top: 5px; font-size: 14px; letter-spacing: 2px; }
        .drop-zone { border: 2px dashed #444; border-radius: 10px; padding: 40px; cursor: pointer; transition: 0.3s; background: #222; }
        .drop-zone:hover { border-color: #555; background: #252525; }
        .drop-zone p { margin: 5px 0; color: #aaa; }
        .loader { border: 4px solid #333; border-top: 4px solid #fff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #result { margin-top: 20px; }
        .btn { background: #fff; color: #000; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; text-decoration: none; display: block; box-sizing: border-box; }
        .error-box { background: #2a1a1a; color: #ff5f5f; padding: 10px; border-radius: 5px; font-size: 12px; text-align: left; white-space: pre-wrap; display: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/profile.jpg" alt="RAUF BAHERUNI" class="profile-img">
            <h1>RAUF BAHERUNI</h1>
            <p class="subtitle">AI WATERMARK REMOVER</p>
        </div>
        
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <p style="font-size: 30px;">⬆️</p>
            <p><strong>Upload Image</strong></p>
            <p style="font-size: 12px;">JPG, PNG up to 10MB</p>
            <input type="file" id="fileInput" accept="image/*" style="display:none;">
        </div>

        <div class="loader" id="loader"></div>
        
        <div id="result" style="display:none;">
            <p id="status" style="color: #4caf50; margin-bottom: 10px;">✅ Bypass Successful!</p>
            <img id="preview" src="" style="max-width: 100%; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333;">
            <a class="btn" id="downloadLink" href="#" download="BAHERUNI.jpg">⬇️ Download BAHERUNI.jpg</a>
        </div>

        <div class="error-box" id="errorBox"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');
        const errorBox = document.getElementById('errorBox');

        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            dropZone.style.display = 'none';
            errorBox.style.display = 'none';
            result.style.display = 'none';
            loader.style.display = 'block';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText);
                }
                
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                document.getElementById('preview').src = url;
                document.getElementById('downloadLink').href = url;
                result.style.display = 'block';
            } catch (error) {
                errorBox.innerText = error.message;
                errorBox.style.display = 'block';
                dropZone.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
